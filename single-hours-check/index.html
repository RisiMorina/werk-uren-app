<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mijn uren</title>
  <meta name="description" content="Mijn eigen werkuren bijhouden.">
  <meta name="theme-color" content="#1B4F8F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mijn uren">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="balk">
    <h1 id="titel">Uren invullen</h1>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="scherm" class="scherm"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabs" aria-label="Hoofdmenu">
    <button class="tab" data-tab="invullen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Invullen</span>
    </button>
    <button class="tab" data-tab="maand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Maand</span>
    </button>
    <button class="tab" data-tab="bestanden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/></svg>
      <span>Bestanden</span>
    </button>
  </nav>

  <dialog id="dlg" class="dlg"></dialog>

  <noscript><p style="padding:24px">Deze app heeft JavaScript nodig.</p></noscript>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
